[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deadlock-perf-lab"
version = "0.3.0"
description = "Deadlock Performance Lab: find out what really changes your FPS in Deadlock on Linux"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Deadlock Performance Lab contributors"}]
keywords = ["deadlock", "benchmark", "linux", "mangohud", "frametime"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Benchmark",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.12"]

[project.scripts]
dpl = "deadlock_perf_lab.cli:main"

[project.urls]
Homepage = "https://github.com/itchyfeetleech/Deadlock-Performance-Lab"
Issues = "https://github.com/itchyfeetleech/Deadlock-Performance-Lab/issues"
Documentation = "https://github.com/itchyfeetleech/Deadlock-Performance-Lab/tree/main/docs"
"Community results" = "https://itchyfeetleech.github.io/Deadlock-Performance-Lab/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deadlock_perf_lab = ["assets/*.json", "assets/*.cfg", "assets/*.html", "assets/*.svg"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
