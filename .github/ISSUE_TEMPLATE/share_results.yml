name: Share results
description: Share what you measured, with the conditions that make it meaningful.
labels: [results]
body:
  - type: textarea
    id: what
    attributes:
      label: What did you test, and why?
      description: The configs or settings you compared, and what you expected.
    validations:
      required: true
  - type: textarea
    id: conditions
    attributes:
      label: Machine and conditions
      description: CPU, GPU, RAM, resolution, graphics settings, Proton and driver versions, replay and tick, benchmark length and rounds.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results and caveats
      description: Attach the report ZIP (Results tab → Share ZIP), and note baseline variation, anything you couldn't confirm, and visual tradeoffs. No replay files or raw logs.
    validations:
      required: true
